<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Recipes AI Generator</title>
  </head>
  <body>
    <header>
      <h1>Welcome to the AI Recipes Generator</h1>
    </header>
    <main>
      <div class="container">
        <div class="card">
          <form>
            <input
              class="recipe-input"
              type="text"
              placeholder="enter the type of recipe you're looking for"
              autofocus
              required
              autocomplete="off"
            />
            <input type="submit" value="Submit" class="submit-button" />
          </form>
          <div class="recipe">
            Devil's Food Cake
            <br />
            Ingredients
          </div>
        </div>
      </div>
    </main>

    <footer>
      This AI project was coded by
      <a href="https://github.com/cristhianelcaraca" target="_blank">
        Cristhiane Caraça
      </a>
      and is open-sourced on
      <a href="https://github.com/cristhianelcaraca" target="_blank">GitHub</a>
      and is hosted on
      <a href="https://www.netlify.com" target="_blank">Netlify</a>
    </footer>

    <script src="src/index.js"></script>
  </body>
</html>
