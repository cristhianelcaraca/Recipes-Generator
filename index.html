<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Recipes AI Generator</title>
  </head>
  <body>
    <header>
      <h1>Generate unique recipes with AI in seconds 👩‍🍳🤖</h1>
    </header>
    <main>
      <div class="main-container">
        <div class="form-container">
          <form id="generator-form">
            <input
              class="recipe-input"
              type="text"
              placeholder="enter the recipe you're looking for"
              autofocus
              required
              autocomplete="off"
              id="user-instructions"
            />
            <input type="submit" value="Generate recipe" class="submit-button" />
          </form>
          <div class="hint">i.e: Cake, tarte, rice, etc...</div>
        </div>
        <div class="hidden" id="hidden">
          <div class="recipe" id="recipe">
            <br />
          </div>
        </div>
      </div>
    </main>

    <footer>
      This AI project was coded by
      <a href="https://github.com/cristhianelcaraca" target="_blank">
        Cristhiane Caraça
      </a>
      and is open-sourced on
      <a
        href="https://github.com/cristhianelcaraca/Recipes-Generator"
        target="_blank"
        >GitHub</a
      >
      and is hosted on
      <a href="https://www.netlify.com" target="_blank">Netlify</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="src/index.js"></script>
  </body>
</html>
